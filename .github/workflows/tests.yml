name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # La borne basse de "engines", la LTS de référence (celle de .nvmrc et
        # des autres jobs) et la suivante : une montée de dépendance qui
        # exigerait un node plus récent doit échouer ici, pas sur la machine de
        # quelqu'un après la fusion — et la prochaine LTS se prépare d'avance.
        node: ['22.22.2', '24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # "npm ci" installe exactement le lockfile et échoue s'il a divergé
      # de package.json — ce qui est précisément ce qu'on veut détecter.
      - run: npm ci

      - run: npm test

  lint:
    # Sans bundler, rien ne relit le code avant que le navigateur ne l'exécute :
    # un import mort ou une variable oubliée ne se voyait qu'à l'ouverture de la
    # page, et seulement si le chemin fautif était emprunté.
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

  e2e:
    # Les tests unitaires ne touchent pas src/events/ ni les modales : ce job est
    # le seul à ouvrir vraiment la page, donc le seul à voir qu'un gestionnaire
    # d'événements ne s'accroche plus ou qu'un import a été cassé.
    name: Smoke test navigateur
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Le binaire Chromium ne vient pas avec le paquet npm : sans ce cache, il
      # se retélécharge (~150 Mo) à chaque exécution. La clé suit le lockfile,
      # donc une montée de Playwright invalide le cache d'elle-même.
      - name: Cache du navigateur Playwright
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      # Le smoke test lit index.html par HTTP : les modules ES6 ne se chargent
      # pas depuis file://. Rien à proxifier ici — aucun appel à l'API Bricks
      # n'est fait, le jeu de données est injecté dans le localStorage.
      # Le serveur doit survivre à la fin de cette étape, d'où le nohup : chaque
      # « run » est un shell distinct, et le test tourne dans le suivant.
      - name: Servir le dépôt
        run: |
          nohup npm run serve > serveur.log 2>&1 &
          for _ in $(seq 30); do
            if curl -sf http://127.0.0.1:8099/index.html -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Le serveur n'a pas répondu en 30 s :" >&2
          cat serveur.log >&2
          exit 1

      - run: npm run test:e2e
        env:
          SCREENSHOT: capture-e2e.png

      # Une vérification qui échoue se lit bien plus vite sur l'image que dans
      # les valeurs rapportées par le test.
      - name: Publier la capture en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capture-e2e
          path: capture-e2e.png
          if-no-files-found: ignore

  nginx:
    # Rien d'autre ne lit nginx.conf. Le smoke tourne contre le serveur python de
    # « npm run serve », qui ne relaie rien et n'envoie aucun en-tête de
    # sécurité : les quatre relais, la CSP et les règles de priorité entre
    # « location » n'étaient tenus par aucun test.
    #
    # Ce n'est pas une précaution de principe. Le relais des vignettes, écrit en
    # expression régulière, perdait contre la règle de cache des images
    # imbriquée dans « location / » — seuls les .webp étaient relayés, et lint,
    # tests unitaires et smoke étaient tous verts.
    name: Contrat nginx
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Pas de « npm ci » : le test n'utilise que le fetch de Node.

      - name: Construire et lancer l'image
        run: |
          docker build -t bricks-contrat .
          docker run -d --name bricks-contrat -p 8080:80 bricks-contrat
          for _ in $(seq 20); do
            if curl -sf http://127.0.0.1:8080/index.html -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "L'image n'a pas répondu en 20 s :" >&2
          docker logs bricks-contrat >&2
          exit 1

      - run: npm run test:nginx

      - name: Journal de nginx en cas d'échec
        if: failure()
        run: docker logs bricks-contrat

  audit:
    name: Vulnérabilités
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high
