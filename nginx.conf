events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Configuration pour les fichiers statiques
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    
    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    server {
        listen 80;
        server_name localhost;
        
        # Répertoire racine
        root /usr/share/nginx/html;
        index index.html;
        
        # Configuration pour les fichiers statiques
        location / {
            try_files $uri $uri/ /index.html;
            
            # Headers de sécurité
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # CSP : dernier filet de sécurité si une donnée d'API contenait du HTML.
            # - script-src : les 2 CDN de Chart.js et son plugin treemap
            # - style-src 'unsafe-inline' : index.html utilise des attributs style=
            # - img-src https: : les miniatures viennent du CDN Bricks
            # - connect-src : les appels fetch vers l'API Bricks
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.bricks.co; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

            # Note : X-XSS-Protection est déprécié (ignoré par les navigateurs
            # modernes) et remplacé par la CSP ci-dessus.


            # Support explicite pour les modules ES6 JavaScript
            location ~ \.m?js$ {
                add_header Content-Type application/javascript;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            # Cache pour les autres ressources statiques
            location ~* \.(css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
        
        # Logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
}