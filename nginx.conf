events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ne pas annoncer le numéro de version dans l'en-tête Server ni sur les pages
    # d'erreur. Ce n'est pas une faille — le port n'est ouvert que sur la machine —
    # mais une version exacte est le premier renseignement que cherche un scan
    # automatisé pour choisir un exploit connu. L'en-tête continue d'annoncer
    # « nginx » sans version : le supprimer entièrement demanderait un module tiers.
    server_tokens off;

    # Configuration pour les fichiers statiques
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    
    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Le tracé des départements est du XML de 109 Ko qui tombe à 41 une fois
    # compressé : sans « image/svg+xml » dans cette liste, il partait entier.
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;
    
    server {
        listen 80;
        server_name localhost;

        # Répertoire racine
        root /usr/share/nginx/html;
        index index.html;

        # ------------------------------------------------------------------
        # Proxy vers l'API Bricks
        # ------------------------------------------------------------------
        # api.bricks.co ne renvoie ses en-têtes CORS que pour l'origine
        # https://app.bricks.co, et Cloudflare renvoie un challenge (403) à toute
        # requête venant d'ailleurs. Un appel direct depuis le navigateur est donc
        # impossible : on relaie côté serveur pour que la page ne voie que du
        # same-origin.
        #
        # L'authentification Bricks se fait par cookie de session (better-auth,
        # posé après le SSO Google). Le navigateur ne pouvant pas poser de cookie
        # sur bricks.co depuis localhost, le client envoie sa session dans
        # l'en-tête X-Bricks-Session, que l'on réinjecte ici en Cookie.
        location /api/ {
            proxy_pass https://api.bricks.co/;
            proxy_ssl_server_name on;

            # Se présenter comme l'application officielle
            proxy_set_header Host api.bricks.co;
            proxy_set_header Origin https://app.bricks.co;
            proxy_set_header Referer https://app.bricks.co/;
            proxy_set_header Accept application/json;

            # Le User-Agent du navigateur est transmis tel quel (nginx relaie les
            # en-têtes clients par défaut) : cf_clearance y est lié.
            proxy_set_header Cookie $http_x_bricks_session;
            proxy_set_header X-Bricks-Session "";

            # Les en-têtes CORS de l'amont n'ont plus de sens en same-origin, et sa
            # CSP n'a pas à se mélanger à celle de l'application.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Set-Cookie;

            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;

            # L'amont envoie déjà « cache-control: private, no-store » : rien à ajouter.
        }

        # ------------------------------------------------------------------
        # Proxy vers le suivi de projet
        # ------------------------------------------------------------------
        # projects.bricks.co porte le statut officiel d'un projet et le détail
        # de ses échéances — « defaulted », « unpaid », mises en demeure. C'est
        # la source qui fait foi, là où /investor/portfolio/.../highlighted-updates
        # ne livre que du texte libre.
        #
        # Ce proxy-ci ne porte AUCUN identifiant, et n'en a pas besoin : l'API
        # de suivi répond sans authentification. Il n'existe que pour deux
        # raisons, toutes deux vérifiables sur ses réponses :
        #
        #  - elle n'émet aucun en-tête Access-Control-Allow-Origin et pose un
        #    « Cross-Origin-Resource-Policy: same-origin » (valeurs par défaut de
        #    Helmet), donc aucune page d'une autre origine n'a le droit de lire
        #    ses réponses — pas même app.bricks.co ;
        #  - Cloudflare la garde, et renvoie un challenge 403 à un client dont
        #    l'empreinte TLS ne correspond pas à son User-Agent. nginx passe.
        #
        # C'est pourquoi le favori de collecte ne peut pas couvrir les statuts,
        # là où il couvre tout api.bricks.co.
        location /projects-api/ {
            proxy_pass https://projects.bricks.co/api-prod/;
            proxy_ssl_server_name on;

            proxy_set_header Host projects.bricks.co;
            proxy_set_header Origin https://app.bricks.co;
            proxy_set_header Referer https://app.bricks.co/;
            proxy_set_header Accept application/json;

            # Aucun Cookie relayé : les deux lignes qui traînaient ici copiaient
            # $http_x_bricks_session, que le client n'envoie jamais sur ce
            # chemin — elles injectaient un en-tête vide depuis toujours.
            proxy_set_header Cookie "";

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Set-Cookie;

            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # Dernière version publiée
        # ------------------------------------------------------------------
        # Le seul appel que l'application fait d'elle-même vers autre chose que
        # Bricks. Il ne porte rien du portefeuille — l'URL est fixe et sans
        # paramètre — mais il apprend à GitHub l'adresse IP d'où l'outil tourne,
        # une fois par jour. C'est un choix, et il est dit dans docs/securite.md.
        #
        # api.github.com répond pourtant « Access-Control-Allow-Origin: * » :
        # le CORS n'impose pas ce proxy, c'est la CSP qui l'impose. Élargir
        # « connect-src » à api.github.com ouvrirait un canal sortant sur la page
        # qui manipule le cookie de session Bricks ; le relais garde 'self'.
        #
        # Chemin exact, et non préfixe : sans le « = », « /version-api/autre »
        # serait recollé à l'URL amont et ce relais deviendrait un proxy ouvert
        # vers une partie de l'API GitHub.
        location = /version-api {
            proxy_pass https://api.github.com/repos/HermessNRJ/bricks-analyser/releases/latest;
            proxy_ssl_server_name on;

            proxy_set_header Host api.github.com;
            proxy_set_header Accept "application/vnd.github+json";

            # GitHub exige un User-Agent. Celui du navigateur ferait l'affaire,
            # mais il n'a aucune raison de partir : une chaîne fixe suffit, et
            # elle ne dit rien de la machine.
            proxy_set_header User-Agent "bricks-analyser";

            # Rien à relayer : ni cookie de session, ni en-tête d'origine.
            proxy_set_header Cookie "";
            proxy_set_header Origin "";
            proxy_set_header Referer "";

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Set-Cookie;

            proxy_http_version 1.1;

            # Court : personne n'attend cette réponse, et le pied de page est
            # déjà juste sans elle.
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Les données locales ne suivent PAS le repli sur index.html.
        #
        # « try_files … /index.html » rend la page d'accueil, avec un 200, pour
        # tout chemin introuvable. Un fetch de data/demo.json recevait donc du
        # HTML annoncé comme un succès : la vérification de statut côté client
        # ne servait à rien, et c'est l'analyse JSON qui finissait par échouer,
        # trois étapes plus loin et sans rapport apparent avec la cause.
        #
        # Le dossier n'entre pas dans l'image — il porte les exports Bricks et
        # le portefeuille de démonstration, qui restent sur la machine. Un 404
        # franc est la réponse juste, et « ?demo » peut enfin la lire pour ce
        # qu'elle est.
        location /data/ {
            try_files $uri =404;
        }

        # Configuration pour les fichiers statiques
        location / {
            try_files $uri $uri/ /index.html;

            # index.html n'a pas d'empreinte dans son nom : sans cet en-tête, le
            # navigateur le garde en cache heuristique et continue d'afficher la
            # structure de la version précédente après un déploiement.
            expires -1;
            
            # Headers de sécurité
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # CSP : dernier filet de sécurité si une donnée d'API contenait du HTML.
            # - script-src : les 2 CDN de Chart.js et son plugin treemap
            # - style-src 'unsafe-inline' : index.html utilise des attributs style=
            # - img-src https: : les miniatures viennent du CDN Bricks
            # - connect-src 'self' : tous les appels passent par les proxys ci-dessus,
            #   y compris /version-api — d'où l'absence d'api.github.com ici
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

            # Note : X-XSS-Protection est déprécié (ignoré par les navigateurs
            # modernes) et remplacé par la CSP ci-dessus.


            # Support explicite pour les modules ES6 JavaScript
            #
            # Pas de cache long ici : les noms de fichiers ne portent aucune
            # empreinte de contenu, donc « immutable » figerait les navigateurs sur
            # la version précédente à chaque déploiement. « no-cache » n'interdit
            # pas le cache, il impose une revalidation : nginx répond 304 tant que
            # l'ETag n'a pas bougé.
            location ~ \.m?js$ {
                add_header Content-Type application/javascript;
                expires -1;
            }

            # Les feuilles de style suivent le même cycle de vie que le code
            location ~* \.css$ {
                expires -1;
            }

            # Les images changent rarement, mais pas jamais
            location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
                expires 7d;
                add_header Cache-Control "public";
            }
        }
        
        # Logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
}